name: Build Android APK Phieu Theo Doi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kiem tra ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cai dat Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Xay dung du an va nang cap Android SDK
        run: |
          cp lib/main.dart /tmp/main_app.dart
          cd ..
          flutter create --org com.c10.phieutheodoi --project-name phieutheodoi --platforms android build_dir
          cd build_dir
          cp /tmp/main_app.dart lib/main.dart
          
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle || true
          
          flutter pub add sqflite path intl path_provider share_plus
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app-release.apk

      - name: Luu file APK de tai ve
        uses: actions/upload-artifact@v4
        with:
          name: UngDung_PhieuTheoDoi_PT78BH_Full
          path: app-release.apk
